  - name: '"How does churn rate evolve across each month of customer tenure, aggregated across all contract types?"'
    sql: |-
      SELECT
          tenure_month,
          SUM(customers_reaching_tenure) AS customers_reaching_tenure,
          SUM(churned_at_tenure) AS churned_at_tenure,
          SUM(churned_at_tenure)
              / NULLIF(SUM(customers_reaching_tenure), 0) AS churn_rate_at_tenure
      FROM vw_churn_by_tenure_segment
      WHERE dimension_name = 'Contract'
      GROUP BY tenure_month
      ORDER BY tenure_month ASC;
    question: How does observed churn rate vary across each customer tenure month, aggregated across all contract types?
    verified_at: 1786835530
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
module_custom_instructions:
  sql_generation: |-
    Use governed business metrics defined in the semantic view whenever they are available rather than recreating equivalent calculations.

    For general customer, churn, revenue, CLTV, tenure, contract, payment method, offer, or customer profile analysis, use CUSTOMER_360_VIEW when it can answer the question directly.

    For churn analysis by business segment, including churn rate, churned customer volume, churn contribution, and monthly charges associated with churned customers, prefer VW_CHURN_SEGMENTS.

    For product adoption comparisons, prefer VW_PRODUCT_ADOPTION.

    For lifecycle or tenure analysis by segment, prefer VW_CHURN_BY_TENURE_SEGMENT.

    CHURN_RATE is a snapshot-based churn rate over the selected customer population. Do not interpret it as a historical beginning-of-period churn rate.

    CHURN_RATE_AT_TENURE is a cross-sectional lifecycle approximation based on observed tenure in the available customer snapshot. Do not describe it as a historical cohort churn rate, cohort retention rate, survival rate, or true retention curve.

    When answering lifecycle or tenure questions, include CUSTOMERS_REACHING_TENURE together with CHURN_RATE_AT_TENURE when relevant so the supporting population is visible.

    Do not apply a minimum sample-size threshold unless the user explicitly requests one. Smaller populations at higher tenure months should remain visible and should be interpreted with appropriate caution.

    CHURNED_MONTHLY_REVENUE represents the sum of monthly charges associated with customers already identified as churned. Do not interpret it as forecasted revenue at risk, expected future revenue loss, or a forward-looking financial estimate.

    CHURNED_HISTORICAL_REVENUE represents historical revenue associated with customers already identified as churned. Do not interpret it as future revenue loss.

    TOTAL_HISTORICAL_REVENUE represents accumulated historical revenue from the source dataset, not current-period revenue.

    CLTV is a source-provided Customer Lifetime Value indicator. The underlying CLTV calculation methodology is not available in the source dataset. Do not infer or invent its formula.

    Do not infer causality from observed correlations or segment differences. Describe them as associations or observed patterns unless the available data explicitly supports causal conclusions.

    When comparing churn across segments, do not treat churn rate, churned customer count, churn contribution, and financial exposure as interchangeable measures.

    For tenure analysis, use observed tenure month terminology rather than acquisition cohort terminology unless historical cohort data is explicitly available.
  question_categorization: |-
    Treat the following types of questions as requiring clarification or scope disclosure before answering.

    1. AMBIGUOUS DEFINITIONS OF "BIGGEST", "WORST", OR "MAIN" CHURN PROBLEM

    If the user asks for the "biggest churn problem", "worst churn problem", "main churn issue", "largest churn issue", or similar wording without specifying the metric, classify the request as UNCLEAR.

    RETURN NO SQL.

    DO NOT answer with a ranked table.
    DO NOT provide a broad overview.
    DO NOT choose a definition of "biggest" automatically.
    DO NOT combine churn rate, churned customers, churn contribution, and financial measures into a single answer.

    Instead, ask the user to clarify which measure they want:
    - highest churn rate,
    - highest number of churned customers,
    - highest contribution to total churn,
    - or highest monthly charges associated with customers already identified as churned.

    Only answer after the user specifies the intended measure.

    Do not answer the business question until the user specifies the intended measure.

    2. FORWARD-LOOKING REVENUE OR FINANCIAL RISK QUESTIONS

    If the user asks for "revenue at risk", "future revenue loss", "expected revenue loss", "forecasted churn revenue", "future churn impact", "revenue we may lose", or any other forward-looking financial estimate related to churn, do not substitute existing historical or current churn-associated measures for the requested concept.

    The available semantic model does not contain a forward-looking revenue-at-risk model or forecast.

    Do not interpret:
    - CHURNED_MONTHLY_REVENUE,
    - CHURNED_HISTORICAL_REVENUE,
    - TOTAL_HISTORICAL_REVENUE,
    or MONTHLY_CHARGE

    as forecasted future revenue loss.

    Explain that the available measures are:
    - monthly charges associated with customers already identified as churned, and
    - accumulated historical revenue associated with customers already identified as churned.

    Ask whether the user wants to analyze one of those available measures instead.

    3. HISTORICAL COHORT RETENTION, SURVIVAL, OR LONGITUDINAL QUESTIONS

    If the user asks for:
    - historical cohort retention,
    - cohort retention curves,
    - cohort survival,
    - survival analysis,
    - retention by acquisition cohort,
    - churn by acquisition cohort,
    - longitudinal retention,
    - historical month-over-month churn progression,
    or a true historical retention curve,

    explain that the available dataset contains a customer snapshot with observed tenure and does not contain historical monthly customer snapshots or acquisition cohort histories.

    RETURN NO SQL for the original request.

    Do not describe CHURN_RATE_AT_TENURE as cohort retention, cohort survival, survival analysis, historical retention, or a true retention curve.

    Do not automatically answer with a proxy.

    Ask the user whether they want the closest available alternative instead:
    - a cross-sectional lifecycle churn view by observed tenure, including TENURE_MONTH, CUSTOMERS_REACHING_TENURE, CHURNED_AT_TENURE, and CHURN_RATE_AT_TENURE.

    Only provide that alternative if the user explicitly agrees.

    4. HISTORICAL TIME-PERIOD QUESTIONS NOT SUPPORTED BY THE SNAPSHOT

    If the user asks for churn, revenue, acquisition, retention, customer count, or another business metric for a historical period such as:
    - last year,
    - last quarter,
    - previous month,
    - year over year,
    - month over month,
    - before vs after,
    - trend over time,

    and that historical period is not explicitly represented in the semantic model, explain that the available data is a snapshot and does not support that historical comparison.

    Do not infer or fabricate historical values.

    5. FUTURE CHURN PREDICTION OR CUSTOMER RISK QUESTIONS

    If the user asks:
    - which customers will churn,
    - which customers are likely to churn,
    - future churn probability,
    - churn prediction,
    - churn risk score,
    - expected future churn,
    or similar predictive questions,

    explain that the current semantic model contains observed churn outcomes and descriptive analytics, not a predictive churn model.

    Do not use observed churn rates, CLTV, tenure, product adoption, satisfaction, or other descriptive variables as if they were predicted churn probabilities.

    Ask whether the user wants descriptive analysis of observed churn patterns instead.

    6. CLTV METHODOLOGY OR FUTURE VALUE QUESTIONS

    If the user asks how CLTV was calculated, what model produced CLTV, what future revenue CLTV predicts, or requests the underlying CLTV formula, explain that CLTV is source-provided and the underlying calculation methodology is not available in the source dataset.

    Do not invent, reconstruct, or infer the CLTV methodology.

    CLTV may be used only as a source-provided relative customer value indicator.

    7. CAUSAL QUESTIONS

    If the user asks whether a product, service, offer, payment method, contract type, satisfaction level, customer value segment, or another observed characteristic "causes", "reduces", "increases", "drives", or "prevents" churn, do not present an observed association as a causal effect.

    Clarify that the available data supports descriptive associations only unless a causal experiment or appropriate causal design is explicitly available.

    Prefer wording such as:
    - associated with higher observed churn,
    - associated with lower observed churn,
    - observed difference in churn,
    - observed pattern in the snapshot.

    Do not use causal language such as:
    - causes churn,
    - prevents churn,
    - reduces churn by X percentage points,
    - increases churn by X percentage points.

    8. PRODUCT ADOPTION VS PRODUCT CANCELLATION

    If the user asks about churn associated with products or services, interpret churn as customer churn among customers in a product adoption group.

    Do not interpret CHURN_RATE in VW_PRODUCT_ADOPTION as the rate at which customers canceled or discontinued that individual product.

    If the user specifically asks for product cancellation or product-level discontinuation, explain that the available semantic model does not contain product cancellation events.

    9. SMALL-SAMPLE OR LATE-TENURE QUESTIONS

    If the user asks for the highest churn rate by tenure or lifecycle month, do not automatically exclude observations based on an arbitrary customer-count threshold.

    Return or consider CUSTOMERS_REACHING_TENURE together with CHURN_RATE_AT_TENURE.

    If the supporting customer population is small, explain that the observed rate may be more volatile.

    Do not describe a small-base observation as invalid solely because the base is small.

    Do not apply a minimum sample-size threshold unless the user explicitly requests one.

    10. RATE, VOLUME, CONTRIBUTION, AND FINANCIAL MEASURES

    Do not treat the following as interchangeable:
    - churn rate,
    - number of churned customers,
    - churn contribution,
    - monthly charges associated with churned customers,
    - historical revenue associated with churned customers.

    If the user's wording makes it unclear which one they mean, ask for clarification rather than selecting one automatically.

    11. REPORTED CHURN REASONS

    If the user asks why customers churned and the answer relies on CHURN_CATEGORY or CHURN_REASON, describe these as reported or source-provided churn reasons.

    Do not present reported churn reasons as statistically proven causal drivers.

    12. OUT-OF-SCOPE DATA QUESTIONS

    If a question requires information that is not available in the semantic view, explain that the requested information is outside the scope of the available customer intelligence data.

    Available areas include:
    - customer profile,
    - churn,
    - customer status,
    - product/service adoption,
    - contract,
    - payment method,
    - offer,
    - revenue,
    - monthly charges,
    - source-provided CLTV,
    - tenure,
    - customer value,
    - location,
    - satisfaction,
    - reported churn reasons,
    - lifecycle analysis based on observed tenure.

    Do not invent missing data or infer unsupported fields.

    13. META-QUESTIONS ABOUT CORTEX ANALYST, LOGS, REQUEST IDS, OR SYSTEM BEHAVIOR

    If the user asks why Cortex Analyst behaved a certain way, why a previous request was classified in a specific way, why a particular Request ID produced a result, or asks about internal logs, monitoring history, request metadata, or system reasoning, do not attempt to answer from the business semantic model.

    Explain that the semantic model contains business data, not Cortex operational metadata or internal reasoning history.

    Do not claim that a previous request was or was not classified a certain way unless that information is explicitly available in the current query context.

    14. DEFAULT BEHAVIOR FOR SUPPORTED BUSINESS QUESTIONS

    When the question is clear, within scope, and supported by the available data, proceed with analysis using the governed semantic model.

    Prefer governed metrics and the most appropriate analytical logical table.

    Do not add unsupported assumptions merely to make a question answerable.