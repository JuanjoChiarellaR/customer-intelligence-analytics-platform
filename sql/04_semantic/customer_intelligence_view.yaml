name: CUSTOMER_INTELLIGENCE_VIEW
tables:
  - name: CUSTOMER_360_VIEW
    description: The table contains a comprehensive view of customer profiles, consolidating demographic and geographic information for each individual. Each record represents a single customer and includes details about personal characteristics such as age, marital status, and household composition, as well as location data and customer engagement attributes like referral activity and contract details.
    base_table:
      database: CUSTOMER_INTELLIGENCE
      schema: CORE
      table: CUSTOMER_360_VIEW
    dimensions:
      - name: AGE_BAND
        description: The age band or age range grouping that a customer falls into.
        expr: AGE_BAND
        data_type: VARCHAR(8)
        sample_values:
          - 30-44
          - Under 30
          - 45-59
      - name: CHURN_CATEGORY
        description: The category of churn reason associated with a customer, indicating the broad classification of why a customer discontinued their relationship or subscription.
        expr: CHURN_CATEGORY
        data_type: VARCHAR(16777216)
        sample_values:
          - Competitor
          - Dissatisfaction
      - name: CHURN_FLAG
        description: A binary flag indicating whether a customer has churned (1) or not (0).
        expr: CHURN_FLAG
        data_type: NUMBER(1,0)
        sample_values:
          - '1'
          - '0'
      - name: CHURN_REASON
        description: The reason why a customer has churned or discontinued their relationship with the business.
        expr: CHURN_REASON
        data_type: VARCHAR(16777216)
        sample_values:
          - Competitor had better devices
          - Service dissatisfaction
      - name: CITY
        description: The city associated with the customer's address.
        expr: CITY
        data_type: VARCHAR(16777216)
        sample_values:
          - Santa Maria
          - El Cerrito
          - Ducor
      - name: CLTV
        description: Source-provided Customer Lifetime Value (CLTV) indicator used to compare relative customer value. The underlying calculation methodology is not provided by the source dataset.
        expr: CLTV
        data_type: NUMBER(38,0)
        sample_values:
          - '2058'
          - '2555'
          - '2654'
      - name: CONTRACT
        description: Customer contract type. Values include Month-to-Month, One Year, and Two Year.
        expr: CONTRACT
        data_type: VARCHAR(16777216)
        sample_values:
          - Month-to-Month
          - One Year
          - Two Year
      - name: CUSTOMER_ID
        description: Unique identifier assigned to each customer.
        expr: CUSTOMER_ID
        data_type: VARCHAR(16777216)
        sample_values:
          - 2957-LOLHO
          - 7602-DBTOU
          - 0020-JDNXP
      - name: CUSTOMER_STATUS
        description: Observed customer lifecycle status in the available snapshot. Values include Joined, Stayed, and Churned.
        expr: CUSTOMER_STATUS
        data_type: VARCHAR(16777216)
        sample_values:
          - Stayed
          - Joined
          - Churned
      - name: CUSTOMER_VALUE_SEGMENT
        synonyms:
          - CLTV segment
          - customer value tier
          - value segment
        description: The customer's value-based segment classification, grouping customers by their relative worth or importance to the business.
        expr: CUSTOMER_VALUE_SEGMENT
        data_type: VARCHAR(16777216)
        sample_values:
          - Low Value
          - Mid-High Value
          - Mid-Low Value
      - name: INTERNET_SERVICE
        description: Indicates whether the customer has internet service.
        expr: INTERNET_SERVICE
        data_type: VARCHAR(16777216)
        sample_values:
          - 'No'
          - 'Yes'
      - name: INTERNET_TYPE
        description: Type of internet service used by the customer when internet service is present.
        expr: INTERNET_TYPE
        data_type: VARCHAR(16777216)
        sample_values:
          - DSL
          - Fiber Optic
      - name: OFFER
        description: The promotional offer associated with a customer.
        expr: OFFER
        data_type: VARCHAR(16777216)
        sample_values:
          - Offer B
          - Offer E
      - name: PAYMENT_METHOD
        description: The payment method used by the customer (e.g., credit card, bank transfer, cash).
        expr: PAYMENT_METHOD
        data_type: VARCHAR(16777216)
        sample_values:
          - Bank Withdrawal
          - Credit Card
          - Mailed Check
      - name: PREMIUM_TECH_SUPPORT
        description: Indicates whether the customer has premium technical support.
        expr: PREMIUM_TECH_SUPPORT
        data_type: VARCHAR(16777216)
        sample_values:
          - 'Yes'
          - 'No'
      - name: SATISFACTION_SCORE
        description: Numerical score representing a customer's satisfaction level.
        expr: SATISFACTION_SCORE
        data_type: NUMBER(38,0)
        sample_values:
          - '2'
          - '1'
          - '4'
      - name: STATE
        description: The United States state associated with the customer's address or location.
        expr: STATE
        data_type: VARCHAR(16777216)
        sample_values:
          - California
      - name: TENURE_BAND
        description: The customer's tenure band, representing a categorized range of the duration of their relationship with the organization.
        expr: TENURE_BAND
        data_type: VARCHAR(12)
        sample_values:
          - 7-12 months
          - 13-24 months
          - 25-48 months
      - name: TENURE_IN_MONTHS
        synonyms:
          - customer age in months
          - customer tenure
          - months since joining
          - tenure
        description: The length of a customer's tenure measured in months.
        expr: TENURE_IN_MONTHS
        data_type: NUMBER(38,0)
        sample_values:
          - '15'
          - '3'
          - '24'
      - name: TOTAL_SERVICE_COUNT
        synonyms:
          - number of services
          - product depth
          - products per customer
          - service depth
        description: The total number of services associated with a customer.
        expr: TOTAL_SERVICE_COUNT
        data_type: NUMBER(11,0)
        sample_values:
          - '9'
          - '8'
          - '5'
    facts:
      - name: MONTHLY_CHARGE
        description: The monthly charge amount billed to the customer.
        expr: MONTHLY_CHARGE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '98.8'
          - '76.85'
          - '107.75'
        default_aggregation: 1
      - name: TOTAL_REVENUE
        description: Source-provided accumulated historical revenue associated with the customer. This represents historical accumulated revenue, not current-period revenue.
        expr: TOTAL_REVENUE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '2249.76'
          - '334.73'
          - '3578.27'
        default_aggregation: 1
    metrics:
      - name: AVG_CLTV
        description: Average source-provided Customer Lifetime Value (CLTV) indicator across the selected customer population. The underlying CLTV calculation methodology is not provided by the source dataset and the metric is used as a relative customer value indicator.
        expr: AVG(cltv)
        access_modifier: public_access
      - name: AVG_MONTHLY_CHARGE
        description: Average monthly charge across the selected customer population.
        expr: AVG(monthly_charge)
        access_modifier: public_access
      - name: AVG_TENURE_MONTHS
        description: Average observed customer tenure in months across the selected customer population.
        expr: AVG(tenure_in_months)
        access_modifier: public_access
      - name: CHURN_RATE
        synonyms:
          - attrition rate
          - churn percentage
          - customer churn
          - customer loss rate
        description: Observed churn rate across the selected customer population, calculated as churned customers divided by total unique customers. This is a snapshot-based churn rate, not a historical beginning-of-period churn calculation.
        expr: COUNT_IF(churn_flag = 1) / NULLIF(COUNT(DISTINCT customer_id), 0)
        access_modifier: public_access
      - name: CHURNED_CUSTOMERS
        synonyms:
          - churn volume
          - customer attrition volume
          - customers who churned
          - lost customers
        description: Count of customers identified as churned in the observed customer snapshot.
        expr: COUNT_IF(churn_flag = 1)
        access_modifier: public_access
      - name: TOTAL_CUSTOMERS
        description: Count of unique customers in the selected population, calculated using distinct CUSTOMER_ID values. Use for customer count and as a denominator for population-based metrics.
        expr: COUNT(DISTINCT customer_id)
        access_modifier: public_access
      - name: TOTAL_HISTORICAL_REVENUE
        synonyms:
          - accumulated revenue
          - cumulative historical revenue
          - customer historical revenue
          - historical revenue
        description: Total accumulated historical revenue across the selected customer population, calculated as the sum of the source-provided customer-level TOTAL_REVENUE field. This is historical accumulated revenue, not current-period revenue.
        expr: SUM(total_revenue)
        access_modifier: public_access
      - name: TOTAL_MONTHLY_CHARGES
        description: Total current monthly charges associated with the selected customer population.
        expr: SUM(monthly_charge)
        access_modifier: public_access
  - name: VW_CHURN_BY_TENURE_SEGMENT
    description: The table contains records of customer churn rates analyzed by tenure and segmentation. Each record captures churn behavior at a specific tenure milestone, including the volume of customers reaching that point and the rate at which they churned, broken down across different customer segments.
    base_table:
      database: CUSTOMER_INTELLIGENCE
      schema: ANALYTICS
      table: VW_CHURN_BY_TENURE_SEGMENT
    dimensions:
      - name: DIMENSION_NAME
        description: The name of the dimension used to segment customer churn analysis by tenure.
        expr: DIMENSION_NAME
        data_type: VARCHAR(20)
        sample_values:
          - Contract
          - Customer Value
          - Premium Tech Support
      - name: SEGMENT_VALUE
        description: The specific value or label identifying a customer tenure segment used for churn analysis.
        expr: SEGMENT_VALUE
        data_type: VARCHAR(16777216)
        sample_values:
          - Two Year
          - One Year
          - Month-to-Month
      - name: TENURE_MONTH
        synonyms:
          - lifecycle month
          - month of tenure
          - tenure month
        description: The number of months a customer has been active, used to segment tenure for churn analysis.
        expr: TENURE_MONTH
        data_type: NUMBER(38,0)
        sample_values:
          - '2'
          - '1'
          - '3'
    facts:
      - name: CHURN_BY_TENURE_PRODUCT_DEPTH
        description: Filters the churn-by-tenure analysis to records segmented by the 'Product Depth' dimension, which groups customers by the total number of services they have adopted. Use when questions ask about 'churn over tenure by number of services', 'churn timing by product depth', 'lifecycle churn patterns by service count', or 'how does the number of products a customer has affect churn over time'. Helps answer business questions about whether customers with more or fewer services churn earlier or later in their lifecycle.
        expr: dimension_name = 'Product Depth'
        data_type: BOOLEAN
        access_modifier: public_access
        labels:
          - filter
      - name: CHURN_RATE_AT_TENURE
        synonyms:
          - churn at month
          - churn by tenure
          - lifecycle churn rate
          - tenure churn rate
        description: Observed churn rate at a specific tenure month, calculated as customers churned at that tenure divided by customers whose observed tenure reached at least that month. This is a cross-sectional lifecycle approximation, not a historical cohort churn rate.
        expr: CHURN_RATE_AT_TENURE
        data_type: NUMBER(20,4)
        access_modifier: public_access
        sample_values:
          - '0.0296'
          - '0.0044'
          - '0.0171'
      - name: CHURNED_AT_TENURE
        description: Count of customers in the selected segment who churned at exactly the specified tenure month.
        expr: CHURNED_AT_TENURE
        data_type: NUMBER(13,0)
        access_modifier: public_access
        sample_values:
          - '121'
          - '67'
          - '380'
        default_aggregation: 1
      - name: CONTRACT_CHURN_BY_TENURE
        description: Filters the churn-by-tenure analysis to records segmented by the 'Contract' dimension (e.g., Month-to-Month, One Year, Two Year), covering all observed tenure milestones regardless of customer volume. Use for questions about churn over tenure by contract, churn timing by contract, or lifecycle churn patterns across contract types.
        expr: dimension_name = 'Contract'
        data_type: BOOLEAN
        access_modifier: public_access
        labels:
          - filter
      - name: CUSTOMERS_REACHING_TENURE
        synonyms:
          - customers reaching month
          - customers reaching tenure
          - customers with at least this tenure
        description: Count of customers in the selected segment whose observed tenure reached at least the specified tenure month.
        expr: CUSTOMERS_REACHING_TENURE
        data_type: NUMBER(13,0)
        access_modifier: public_access
        sample_values:
          - '3016'
          - '1458'
          - '661'
        default_aggregation: 1
  - name: VW_CHURN_SEGMENTS
    description: The table contains customer churn analysis broken down by business segmentation dimensions. Each record represents a segment and includes customer volume, churn rate, contribution to total churn, average customer value, and historical and monthly revenue measures associated with customers already identified as churned.
    base_table:
      database: CUSTOMER_INTELLIGENCE
      schema: ANALYTICS
      table: VW_CHURN_SEGMENTS
    dimensions:
      - name: CHURNED_CUSTOMERS
        synonyms:
          - churn volume
          - customer attrition volume
          - customers who churned
          - lost customers
        description: The count of customers who have churned within a given segment.
        expr: CHURNED_CUSTOMERS
        data_type: NUMBER(13,0)
        sample_values:
          - '177'
          - '459'
          - '454'
      - name: DIMENSION_NAME
        description: The name of the dimension used to classify or segment customer churn analysis.
        expr: DIMENSION_NAME
        data_type: VARCHAR(14)
        sample_values:
          - Age Band
          - Contract
          - Customer Value
      - name: SEGMENT_VALUE
        description: The specific category or value within the selected segmentation dimension, such as Month-to-Month for Contract or Low Value for Customer Value.
        expr: SEGMENT_VALUE
        data_type: VARCHAR(16777216)
        sample_values:
          - 75+
          - 60-74
          - Under 30
      - name: TOTAL_CUSTOMERS
        description: The total count of customers within a churn segment.
        expr: TOTAL_CUSTOMERS
        data_type: NUMBER(18,0)
        sample_values:
          - '1943'
          - '1362'
          - '420'
    facts:
      - name: AVG_CLTV
        description: The average Customer Lifetime Value (CLTV) for the segment.
        expr: AVG_CLTV
        data_type: NUMBER(38,2)
        access_modifier: public_access
        sample_values:
          - '4476.91'
          - '4425.70'
          - '4377.73'
      - name: AVG_MONTHLY_CHARGE
        description: The average monthly charge billed to the customer.
        expr: AVG_MONTHLY_CHARGE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '64.17'
          - '79.48'
          - '71.21'
      - name: CHURN_CONTRIBUTION
        synonyms:
          - churn mix
          - contribution to churn
          - share of churn
          - share of total churn
        description: The proportional contribution of a customer segment to overall churn, expressed as a numeric value.
        expr: CHURN_CONTRIBUTION
        data_type: NUMBER(20,4)
        access_modifier: public_access
        sample_values:
          - '0.2541'
          - '0.0947'
          - '0.2429'
      - name: CHURN_RATE
        description: The rate at which customers are discontinuing or leaving, expressed as a numerical value.
        expr: CHURN_RATE
        data_type: NUMBER(20,4)
        access_modifier: public_access
        sample_values:
          - '0.3333'
          - '0.2445'
          - '0.4214'
      - name: CHURN_SEGMENTS_BY_CUSTOMER_VALUE
        description: Filters the churn segments analysis to show only records segmented by the 'Customer Value' dimension, grouping customers by their relative worth or importance to the business (e.g., Low Value, Mid-Low Value, Mid-High Value). Use when questions ask about 'churn by customer value', 'churn rate across value segments', 'which customer value tier churns the most', 'lost revenue by customer value', or 'churn contribution by value segment'. Helps answer business questions about how churn behavior and financial impact differ across customer value tiers, enabling prioritization of retention efforts toward high-value segments.
        expr: dimension_name = 'Customer Value'
        data_type: BOOLEAN
        access_modifier: public_access
        labels:
          - filter
      - name: CHURNED_HISTORICAL_REVENUE
        description: The total historical revenue attributed to churned customers.
        expr: CHURNED_HISTORICAL_REVENUE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '2114547.83'
          - '865576.57'
          - '397729.2'
        default_aggregation: 1
      - name: CHURNED_MONTHLY_REVENUE
        description: Sum of monthly charges associated with customers already identified as churned within the segment. This does not represent forecasted revenue at risk.
        expr: CHURNED_MONTHLY_REVENUE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '15044.05'
          - '14071.55'
          - '34248.7'
        default_aggregation: 1
  - name: VW_PRODUCT_ADOPTION
    description: The table contains records of product adoption metrics aggregated by product. Each record captures the adoption status of a product along with associated customer counts, churn behavior, revenue figures, and average customer lifetime value and tenure.
    base_table:
      database: CUSTOMER_INTELLIGENCE
      schema: ANALYTICS
      table: VW_PRODUCT_ADOPTION
    dimensions:
      - name: ADOPTION_STATUS
        synonyms:
          - adopted
          - product adoption
          - product usage status
        description: Indicates whether customers in the record have adopted the specified product or service.
        expr: ADOPTION_STATUS
        data_type: VARCHAR(16777216)
        sample_values:
          - 'Yes'
          - 'No'
      - name: CHURNED_CUSTOMERS
        synonyms:
          - churn volume
          - customer attrition volume
          - customers who churned
          - lost customers
        description: Count of customers in the product adoption group who are identified as churned in the observed customer snapshot.
        expr: CHURNED_CUSTOMERS
        data_type: NUMBER(13,0)
        sample_values:
          - '1019'
          - '728'
          - '545'
      - name: CUSTOMERS
        description: The total count of customers associated with a given product adoption record.
        expr: CUSTOMERS
        data_type: NUMBER(18,0)
        sample_values:
          - '2019'
          - '4555'
          - '5517'
      - name: PRODUCT_NAME
        synonyms:
          - product
          - product type
          - service
        description: The name of the product.
        expr: PRODUCT_NAME
        data_type: VARCHAR(22)
        sample_values:
          - Phone Service
          - Multiple Lines
          - Internet Service
    facts:
      - name: AVG_CLTV
        description: The average Customer Lifetime Value (CLTV) associated with a product or customer segment.
        expr: AVG_CLTV
        data_type: NUMBER(38,2)
        access_modifier: public_access
        sample_values:
          - '4620.69'
          - '4658.48'
          - '4281.32'
      - name: AVG_MONTHLY_CHARGE
        description: The average monthly charge amount for a product or service.
        expr: AVG_MONTHLY_CHARGE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '42.03'
          - '82.04'
          - '67.2'
      - name: AVG_TENURE_MONTHS
        description: The average tenure of customers or users measured in months.
        expr: AVG_TENURE_MONTHS
        data_type: NUMBER(38,2)
        access_modifier: public_access
        sample_values:
          - '32.45'
          - '41.20'
          - '32.92'
      - name: AVG_TOTAL_REVENUE
        description: The average total revenue generated, expressed as a floating-point value.
        expr: AVG_TOTAL_REVENUE
        data_type: FLOAT
        access_modifier: public_access
        sample_values:
          - '1505.02'
          - '3198.35'
          - '4599.35'
      - name: CHURN_RATE
        synonyms:
          - attrition rate
          - churn percentage
          - customer churn
          - customer loss rate
        description: Observed customer churn rate for the product adoption group, calculated as churned customers divided by customers in that adoption group. This measures customer churn, not discontinuation of the individual product.
        expr: CHURN_RATE
        data_type: NUMBER(20,4)
        access_modifier: public_access
        sample_values:
          - '0.3165'
          - '0.2433'
          - '0.2438'
      - name: CUSTOMER_SHARE
        description: Share of the relevant customer population represented by the product adoption status.
        expr: CUSTOMER_SHARE
        data_type: NUMBER(25,4)
        access_modifier: public_access
        sample_values:
          - '0.9032'
          - '0.6551'
          - '0.4218'
      - name: NON_ADOPTED_CUSTOMERS
        description: Filters the product adoption table to include only customers who have NOT adopted a given product or service (adoption_status = 'No'). Use when questions ask about 'customers who did not adopt', 'non-adopters', 'customers without a product', 'churn rate for non-adopters', or when comparing adopted vs. non-adopted customer behavior. Helps answer business questions about the churn rate, revenue, tenure, or lifetime value of customers who lack a specific product, enabling side-by-side comparison with adopters to assess the impact of product adoption on retention and value.
        expr: adoption_status = 'No'
        data_type: BOOLEAN
        access_modifier: public_access
        labels:
          - filter
verified_queries:
  - name: '"What is the range and average customer lifetime value across each customer value segment? Show the number of customers in each segment, minimum CLTV, average CLTV, and maximum CLTV."'
    sql: |-
      SELECT
        customer_value_segment,
        COUNT(DISTINCT customer_id) AS customers,
        MIN(cltv) AS min_cltv,
        AVG(cltv) AS avg_cltv,
        MAX(cltv) AS max_cltv
      FROM
        customer_360_view
      GROUP BY
        customer_value_segment
      ORDER BY
        avg_cltv;
    question: What is the range and average customer lifetime value across each customer value segment? Show the number of customers in each segment, minimum CLTV, average CLTV, and maximum CLTV.
    verified_at: 1786914045
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
  - name: '"For products that customers have adopted, which ones have the highest churn rate, and how do they compare in terms of customer count, monthly charges, lifetime value, and tenure?"'
    sql: |-
      SELECT
        product_name,
        customers,
        churn_rate,
        avg_monthly_charge,
        avg_cltv,
        avg_tenure_months
      FROM
        vw_product_adoption
      WHERE
        adoption_status = 'Yes'
      ORDER BY
        churn_rate DESC
    question: For products that customers have adopted, which ones have the highest churn rate, and how do they compare in terms of customer count, monthly charges, lifetime value, and tenure?
    verified_at: 1786911861
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
  - name: '"For each contract type, identify the observed tenure month with the highest churn rate. Show the contract type, tenure month, number of customers who reached that tenure, number of customers who churned at that tenure, and the observed churn rate."'
    sql: |-
      SELECT
        segment_value AS contract_type,
        tenure_month,
        customers_reaching_tenure,
        churned_at_tenure,
        churn_rate_at_tenure
      FROM vw_churn_by_tenure_segment
      WHERE dimension_name = 'Contract'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY segment_value
        ORDER BY churn_rate_at_tenure DESC
      ) = 1
      ORDER BY contract_type;
    question: For each contract type, identify the observed tenure month with the highest churn rate. Show the contract type, tenure month, number of customers who reached that tenure, number of customers who churned at that tenure, and the observed churn rate.
    verified_at: 1786912144
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
  - name: '"""""""""""""""Which customer segments have the highest monthly charges associated with churned customers? Show the segment, total customers, churned customers, churn rate, churn contribution, and monthly charges associated with churned customers, ranked from hig"'
    sql: |-
      SELECT
        dimension_name,
        segment_value,
        total_customers,
        churned_customers,
        churn_rate,
        churn_contribution,
        churned_monthly_revenue
      FROM vw_churn_segments
      ORDER BY churned_monthly_revenue DESC;
    question: Which customer segments have the highest monthly charges associated with churned customers? Show the segment, total customers, churned customers, churn rate, churn contribution, and monthly charges associated with churned customers, ranked from highest to lowest churned monthly charges.
    verified_at: 1786912359
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
  - name: '"Compare all contract types by observed churn rate and contribution to total churn. Show total customers, churned customers, churn rate, and churn contribution, and rank contract types from highest to lowest churn rate."'
    sql: |-
      SELECT
        segment_value,
        total_customers,
        churned_customers,
        churn_rate,
        churn_contribution
      FROM vw_churn_segments
      WHERE dimension_name = 'Contract'
      ORDER BY churn_rate DESC;
    question: Compare all contract types by observed churn rate and contribution to total churn. Show total customers, churned customers, churn rate, and churn contribution, and rank contract types from highest to lowest churn rate.
    verified_at: 1786912397
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
  - name: |-
      """""""""""""""For each product, compare the customer churn rate between customers who adopted the product (adoption_status = 'Yes') and customers who did not (adoption_status = 'No').

      Show:
      - the number of customers who adopted the product,
      - the churn rate amo"
    sql: |-
      WITH adopted AS (
        SELECT
          product_name,
          churn_rate AS adopted_churn_rate,
          customers AS adopted_customers
        FROM
          vw_product_adoption
        WHERE
          adoption_status = 'Yes'
      ),
      not_adopted AS (
        SELECT
          product_name,
          churn_rate AS not_adopted_churn_rate,
          customers AS not_adopted_customers
        FROM
          vw_product_adoption
        WHERE
          adoption_status = 'No'
      )
      SELECT
        a.product_name,
        a.adopted_customers,
        a.adopted_churn_rate,
        n.not_adopted_customers,
        n.not_adopted_churn_rate,
        (a.adopted_churn_rate - n.not_adopted_churn_rate) AS churn_rate_gap
      FROM
        adopted AS a
        JOIN not_adopted AS n ON a.product_name = n.product_name
      ORDER BY
        churn_rate_gap ASC
        /* Generated by Cortex Analyst (request_id: 930f77fb-0d04-4797-8c0a-b1722235fa73) */
    question: |-
      For each product, compare the customer churn rate between customers who adopted the product (adoption_status = 'Yes') and customers who did not (adoption_status = 'No').

      Show:
      - the number of customers who adopted the product,
      - the churn rate among customers who adopted the product,
      - the number of customers who did not adopt the product,
      - the churn rate among customers who did not adopt the product,
      - and the churn rate gap, calculated as adopted churn rate minus non-adopted churn rate.

      Rank products from the most negative to the most positive churn rate gap.
    verified_at: 1786906047
    verified_by: Juan Chiarella
    use_as_onboarding_question: false
  - name: '"How does churn rate, number of churned customers, and churn contribution differ across customer value segments?"'
    sql: |-
      SELECT
        segment_value,
        total_customers,
        churned_customers,
        churn_rate,
        churn_contribution
      FROM
        vw_churn_segments
      WHERE
        dimension_name = 'Customer Value'
      ORDER BY
        churn_rate DESC NULLS LAST
        /* Generated by Cortex Analyst (request_id: b630a7c2-6534-4176-bdb4-6108842aad6b) */
    question: How does churn rate, number of churned customers, and churn contribution differ across customer value segments?
    verified_at: 1786835127
    verified_by: Juan Chiarella
